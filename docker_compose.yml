version: "3.9"

services:

  app:
    build: .
    container_name: hrms_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:17
    container_name: hrms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: hrms_redis
    ports:
      - "6379:6379"